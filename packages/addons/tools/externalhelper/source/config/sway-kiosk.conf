# Sway Kiosk Configuration for externalhelper
# Default config template

# Window rules: force full screen and no borders
default_border none
default_floating_border none
for_window [app_id=".*"] fullscreen enable, border none
for_window [class=".*"] fullscreen enable, border none

# Cursor behavior: hide cursor after inactivity
seat * hide_cursor 3000

# Input: keyboard layout
input * {
    xkb_layout "@XKB_LAYOUT@"
}

# Keybindings: Volume Control
bindsym XF86AudioRaiseVolume exec @ADDONDIR@/bin/volume-helper up @VOLUME_STEP@
bindsym XF86AudioLowerVolume exec @ADDONDIR@/bin/volume-helper down @VOLUME_STEP@
bindsym XF86AudioMute        exec @ADDONDIR@/bin/volume-helper mute
# Fallback volume shortcuts
bindsym Mod4+equal           exec @ADDONDIR@/bin/volume-helper up @VOLUME_STEP@
bindsym Mod4+minus           exec @ADDONDIR@/bin/volume-helper down @VOLUME_STEP@
bindsym Mod4+m               exec @ADDONDIR@/bin/volume-helper mute

# Keybindings: OSK manual toggle
bindsym Mod4+k               exec kill -USR1 $(pidof wvkbd-mobintl)

# Include dynamically generated display outputs
include @OUTPUTS_CONF@

# User custom sway config override if present
include /storage/.config/sway/config

# Volume OSD (wob)
exec_always rm -f /run/user/0/wob.fifo && mkfifo /run/user/0/wob.fifo && tail -f /run/user/0/wob.fifo | @ADDONDIR@/bin/wob

# Virtual Keyboard (wvkbd) with zwp_input_method_v2 auto popup
@OSK_COMMAND@

# Session helper (launches WayVNC, executes target app, and shuts down Sway on exit)
exec @ADDONDIR@/bin/wayland-session-helper @APP_RUNNER@

